<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="">
  <meta name="tv-api-base" content="https://cs2team39.cs2410-web01pvm.aston.ac.uk">
  <title>Products & Stock — Tech Verse Admin</title>
  <link rel="stylesheet" href="css/tv.css">
  <script src="https://kit.fontawesome.com/30b10264ad.js" crossorigin="anonymous"></script>
  <style>
    body { background: #f0f2f5; }
    .tv-admin-page { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
    .tv-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .tv-stat-card { background: var(--tv-surface); border: 1px solid var(--tv-border); border-radius: var(--tv-radius-lg); padding: 20px; }
    .tv-stat-card__label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--tv-text-3); margin-bottom: 8px; }
    .tv-stat-card__val { font-family: var(--tv-font-head); font-size: 32px; font-weight: 800; color: var(--tv-text); }
    .tv-stat-card__sub { font-size: 12px; color: var(--tv-text-3); margin-top: 4px; }
    .tv-admin-card { background: var(--tv-surface); border: 1px solid var(--tv-border); border-radius: var(--tv-radius-lg); padding: 20px; margin-bottom: 20px; }
    .tv-admin-card h3 { font-family: var(--tv-font-head); font-size: 15px; font-weight: 700; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--tv-border); display: flex; align-items: center; gap: 8px; }
    .tv-admin-card h3 i { color: var(--tv-primary); }
  </style>
</head>
<body>
  <!-- Admin nav -->
  <div style="background:var(--tv-navy);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.4);">
    <div style="max-width:1280px;margin:0 auto;padding:0 16px;display:flex;align-items:center;height:56px;gap:24px;">
      <a href="index.html"><img src="images/Techverse Logo/techverse_logo.png" alt="TechVerse" style="height:38px;width:auto;object-fit:contain;"></a>
      <span style="font-size:11px;font-weight:700;padding:3px 8px;background:var(--tv-yellow);color:var(--tv-navy);border-radius:4px;text-transform:uppercase;letter-spacing:0.08em;">Admin</span>
      <nav style="display:flex;gap:4px;margin-left:8px;">
        <a href="admin.html" class="tv-catnav__link">Dashboard</a>
        <a href="admin-products.html" class="tv-catnav__link active">Products</a>
        <a href="admin-returns.html" class="tv-catnav__link">Returns</a>
        <a href="admin-reviews.html" class="tv-catnav__link">Reviews</a>
        <a href="admin-messages.html" class="tv-catnav__link">Messages</a>
      </nav>
      <div style="margin-left:auto;display:flex;gap:10px;align-items:center;">
        <a href="customer.html" class="tv-btn tv-btn--ghost tv-btn--sm" style="color:#ccc;border-color:rgba(255,255,255,0.2);font-size:12px;">View Shop</a>
        <button id="signout" class="tv-btn tv-btn--sm" style="background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.2);font-size:12px;">Sign Out</button>
      </div>
    </div>
  </div>
  <div class="tv-admin-page">
    <div id="auth-status" style="display:none;"></div>
    <div id="admin-content">
    <h1 class="tv-page-title" style="margin-bottom:20px;">Products & Stock</h1>

    <div class="tv-admin-card">
      <h3><i class="fa-solid fa-box-archive"></i> Product Management</h3>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <input id="product-search" class="tv-input" type="text" placeholder="Search products..." style="max-width:260px;">
        <button id="new-product-btn" class="tv-btn tv-btn--blue tv-btn--sm"><i class="fa-solid fa-plus"></i> Add Product</button>
        <button id="refresh-products" class="tv-btn tv-btn--ghost tv-btn--sm"><i class="fa-solid fa-rotate"></i> Refresh</button>
        <div id="notice" style="flex:1;font-size:13px;color:var(--tv-success);"></div>
      </div>
      <div id="product-form" style="background:var(--tv-bg);border:1px solid var(--tv-border);border-radius:var(--tv-radius);padding:20px;margin-bottom:16px;display:none;">
        <h4 id="form-title" style="font-family:var(--tv-font-head);font-size:15px;font-weight:700;margin-bottom:14px;">Add Product</h4>
        <input id="product-id" type="hidden">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
          <div class="tv-form-group"><label class="tv-label">Product Name</label><input id="name" class="tv-input" type="text" placeholder="Product name"></div>
          <div class="tv-form-group"><label class="tv-label">Brand</label><input id="brand" class="tv-input" type="text" placeholder="Brand"></div>
          <div class="tv-form-group"><label class="tv-label">SKU</label><input id="sku" class="tv-input" type="text" placeholder="TV-ABC-001"></div>
          <div class="tv-form-group"><label class="tv-label">Variant Label</label><input id="variant_label" class="tv-input" type="text" placeholder="e.g. Black / 256GB"></div>
          <div class="tv-form-group"><label class="tv-label">Price (£)</label><input id="price" class="tv-input" type="number" min="0" step="0.01" placeholder="0.00"></div>
          <div class="tv-form-group"><label class="tv-label">Stock Qty</label><input id="stock" class="tv-input" type="number" min="0" placeholder="0"></div>
          <div class="tv-form-group"><label class="tv-label">Low Stock Threshold</label><input id="low_stock_threshold" class="tv-input" type="number" min="0" placeholder="5"></div>
          <div class="tv-form-group"><label class="tv-label">Category Name</label><input id="new_category_name" class="tv-input" type="text" placeholder="e.g. Headphones"><select id="category_id" class="tv-input" style="margin-top:6px;"><option value="">Select existing...</option></select></div>
          <div class="tv-form-group"><label class="tv-label">Image URL</label><input id="image_url" class="tv-input" type="url" placeholder="https://..."></div>
          <div class="tv-form-group"><label class="tv-label">Image File</label><input id="image_file" class="tv-input" type="file" accept="image/*"></div>
        </div>
        <div class="tv-form-group" style="margin-bottom:12px;"><label class="tv-label">Description</label><textarea id="description" class="tv-input" rows="3" style="resize:vertical;"></textarea></div>
        <div style="margin-bottom:14px;display:flex;align-items:center;gap:6px;font-size:13px;">
          <input id="active" type="checkbox" checked> <label>Active listing</label>
        </div>
        <div style="display:flex;gap:10px;">
          <button id="save-product-btn" class="tv-btn tv-btn--blue tv-btn--sm">Save Product</button>
          <button id="reset-form" class="tv-btn tv-btn--ghost tv-btn--sm">Cancel</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="tv-table" id="products-table">
          <thead>
            <tr><th>Product</th><th>SKU / Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="products-table-body">
            <tr><td colspan="6" class="tv-muted" style="text-align:center;padding:32px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading products...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
  </div>
  <script src="javascript/auth.js"></script>
  <script src="javascript/cookie-consent.js"></script>
  <script src="javascript/admin-products.js"></script>
</body>
</html>
