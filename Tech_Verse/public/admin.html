<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="">
  <meta name="tv-api-base" content="https://cs2team39.cs2410-web01pvm.aston.ac.uk">
  <title>Dashboard — Tech Verse Admin</title>
  <link rel="stylesheet" href="css/tv.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://kit.fontawesome.com/30b10264ad.js" crossorigin="anonymous"></script>

</head>
<body>
  <!-- Admin nav -->
  <div class="tv-admin-topnav">
    <div class="tv-admin-topnav__inner">
      <a href="index.html" class="tv-admin-topnav__logo"><img src="images/Techverse Logo/techverse_logo.png" alt="TechVerse"></a>
      <span class="tv-admin-badge">Admin</span>
      <nav class="tv-admin-topnav__nav">
        <a href="admin.html" class="tv-catnav__link active">Dashboard</a>
        <a href="admin-products.html" class="tv-catnav__link">Products</a>
        <a href="admin-returns.html" class="tv-catnav__link">Returns</a>
        <a href="admin-reviews.html" class="tv-catnav__link">Reviews</a>
        <a href="admin-messages.html" class="tv-catnav__link">Messages</a>
      </nav>
      <div class="tv-admin-topnav__actions">
        <a href="customer.html" class="tv-btn tv-btn--ghost tv-btn--sm" style="color:#ccc;border-color:rgba(255,255,255,0.2);">View Shop</a>
        <button id="signout" class="tv-btn tv-btn--sm" style="background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.2);">Sign Out</button>
      </div>
    </div>
  </div>
  <div class="tv-admin-page">
    <div id="auth-status" style="display:none;"></div>
    <div id="admin-alert-banner" style="margin-bottom:16px;"></div>
    <h1 class="tv-page-title" style="margin-bottom:20px;">Dashboard</h1>

    <div id="stats-grid"><div class="tv-stat-grid">
      <div class="tv-stat-card">
        <div class="tv-stat-card__label"><i class="fa-solid fa-box" style="color:var(--tv-primary)"></i> Total Orders</div>
        <div class="tv-stat-card__val" id="stat-orders" >—</div>
        <div class="tv-stat-card__sub">All time</div>
      </div>
      <div class="tv-stat-card">
        <div class="tv-stat-card__label"><i class="fa-solid fa-users" style="color:var(--tv-success)"></i> Users</div>
        <div class="tv-stat-card__val" id="stat-users">—</div>
        <div class="tv-stat-card__sub">Registered accounts</div>
      </div>
      <div class="tv-stat-card">
        <div class="tv-stat-card__label"><i class="fa-solid fa-tag" style="color:var(--tv-accent)"></i> Products</div>
        <div class="tv-stat-card__val" id="stat-products">—</div>
        <div class="tv-stat-card__sub">Active listings</div>
      </div>
      <div class="tv-stat-card">
        <div class="tv-stat-card__label"><i class="fa-solid fa-rotate-left" style="color:var(--tv-warning)"></i> Returns</div>
        <div class="tv-stat-card__val" id="stat-returns">—</div>
        <div class="tv-stat-card__sub">Pending requests</div>
      </div>
      <div class="tv-stat-card">
        <div class="tv-stat-card__label"><i class="fa-solid fa-sterling-sign" style="color:var(--tv-success)"></i> Revenue</div>
        <div class="tv-stat-card__val" id="stat-revenue">—</div>
        <div class="tv-stat-card__sub">Total from orders</div>
      </div>
    </div></div>

    <div id="admin-content"><div class="tv-admin-card">
      <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Orders</h3>
      <div id="recent-orders"><p class="tv-muted"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</p></div>
    </div>

  </div>
  <div id="low-stock" style="display:none;"></div>
  <div id="recent-users" style="display:none;"></div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/cookie-consent.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
