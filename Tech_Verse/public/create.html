<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Create Account - Tech Verse</title>
    <link rel="stylesheet" href="css/create.css">
</head>
<body>

    <div class="backBut">
        <input type="button" value="back" onclick="if(history.length > 1){ history.back(); } else { location.href='index.html'; }">
    </div>

    <div class="logo">
        <h1>Tech Verse</h1>
    </div>

    <div class="wrapper">
        <form id="register-form" action="" method="post" novalidate>
            <h1>Create an account</h1>

            <div class="name_row">
                <div class="input_box half">
                    <input id="reg-first" name="first_name" type="text"
                           placeholder="First Name" autocomplete="given-name" required>
                </div>
                <div class="input_box half">
                    <input id="reg-last" name="last_name" type="text"
                           placeholder="Surname" autocomplete="family-name" required>
                </div>
            </div>

            <div class="input_box">
                <input id="reg-email" name="email" type="email"
                       placeholder="Email" autocomplete="email" required>
            </div>

            <div class="input_box">
                <input id="reg-password" name="password" type="password"
                       placeholder="Password (min. 8 characters)"
                       autocomplete="new-password" required minlength="8">
            </div>

            <div id="pw-strength-text" style="margin:4px 0;font-size:14px;"></div>
            <div id="pw-strength-bar" style="height:6px;width:0;background:red;transition:width 0.3s;border-radius:3px"></div>

            <br>

            <div style="margin:14px 0;font-size:14px;line-height:1.5">
                <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer">
                    <input type="checkbox" id="privacy-consent" name="privacy_consent"
                           required style="margin-top:2px;flex-shrink:0">
                    <span>
                        I have read and agree to the
                        <a href="privacy.html" target="_blank" style="color:#156082">Privacy Policy</a>.
                        I understand how Tech Verse collects and uses my personal data.
                    </span>
                </label>
            </div>

            <div id="captcha">
                <input type="checkbox" id="captcha-box">
                <label for="captcha-box">I'm not a robot</label>
            </div>

            <br>

            <button type="submit" class="button">Create account</button>
            <div id="register-msg" style="margin-top:8px;text-align:center;color:#d00"></div>
        </form>
    </div>

    <script src="javascript/register.js"></script>
    <script src="javascript/cookie-consent.js"></script>
</body>
</html>
